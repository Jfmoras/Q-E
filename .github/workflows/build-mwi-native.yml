name: Build MWI Native Alpha
on:
  push:
    branches: [feature/mwi-native-compose-rebuild]
    paths:
      - 'native-android/**'
      - '.github/workflows/build-mwi-native.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          test -x "$SDKMANAGER" || { echo "Android sdkmanager not installed on runner"; exit 1; }
          "$SDKMANAGER" --licenses < /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native debug APK
        run: gradle -p native-android --no-daemon :app:assembleDebug
      - name: Upload native alpha APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MWI-Native-Alpha-Debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
