name: Build MWI Native Alpha
on:
  push:
    branches: [feature/mwi-native-compose-rebuild]
    paths:
      - 'native-android/**'
      - '.github/workflows/build-mwi-native.yml'
  workflow_dispatch:
concurrency:
  group: mwi-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          test -x "$SDKMANAGER" || { echo "Android sdkmanager not installed on runner"; exit 1; }
          "$SDKMANAGER" --licenses < /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Same permanent key as build-qe-android.yml, so the native APK installs as an update over Q&E V10.1.
      - name: Install permanent signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.QE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.QE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.QE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QE_KEY_ALIAS }}
        run: |
          if [ "$KEY_ALIAS" != "moras-qe" ]; then echo "::error::Expected permanent signing alias moras-qe"; exit 1; fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Set four QE signing repository secrets first."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qe-signing.jks"
          chmod 600 "$RUNNER_TEMP/qe-signing.jks"
          echo "QE_KEYSTORE_PATH=$RUNNER_TEMP/qe-signing.jks" >> "$GITHUB_ENV"
      - name: Build permanently signed native release APK
        env:
          QE_KEYSTORE_PASSWORD: ${{ secrets.QE_KEYSTORE_PASSWORD }}
          QE_KEY_PASSWORD: ${{ secrets.QE_KEY_PASSWORD }}
          QE_KEY_ALIAS: ${{ secrets.QE_KEY_ALIAS }}
        run: gradle -p native-android --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK signature and native-only contents
        run: |
          APK=native-android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Signed release APK was not produced (unsigned build?)"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -1
          if unzip -l "$APK" | grep -E 'assets/(app\.js|index\.html|operations\.(js|html)|styles\.css)'; then
            echo "::error::WebView assets must not be packaged in the native APK"; exit 1
          fi
      - name: Upload signed native APK
        uses: actions/upload-artifact@v4
        with:
          name: Q-E-native-permanently-signed-apk
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
