name: Build Q&E V10.1 Android APK
on:
  push:
    branches:
      - feature/qe-pricing-options-revisions-20261119
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - '.github/workflows/build-qe-android.yml'
  workflow_dispatch:
jobs:
  signed-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate JavaScript syntax
        run: node --check app/src/main/assets/app.js
      - name: Install permanent signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.QE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.QE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.QE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.QE_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Set four QE signing repository secrets first."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qe-signing.jks"
          chmod 600 "$RUNNER_TEMP/qe-signing.jks"
          echo "QE_KEYSTORE_PATH=$RUNNER_TEMP/qe-signing.jks" >> "$GITHUB_ENV"
      - name: Build permanently signed release APK
        env:
          QE_KEYSTORE_PASSWORD: ${{ secrets.QE_KEYSTORE_PASSWORD }}
          QE_KEY_PASSWORD: ${{ secrets.QE_KEY_PASSWORD }}
          QE_KEY_ALIAS: ${{ secrets.QE_KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Q-E-v10-1-permanently-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
