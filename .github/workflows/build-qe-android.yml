name: Build Q&E V10.1 Android APK
on:
  push:
    branches:
      - feature/qe-pricing-options-revisions-20261119
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-qe-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate JavaScript syntax
        run: node --check app/src/main/assets/app.js
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Q-E-v10-1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
