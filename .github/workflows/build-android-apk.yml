name: Build Q&E Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Generate missing Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin
      - name: Verify app JavaScript parses
        run: node --check app/src/main/assets/app.js
      - name: Build and test debug APK
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Restore permanent signing keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.QE_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Configure QE_SIGNING_KEYSTORE_B64 and the three signing password/alias secrets before producing updatable APKs."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/qe-release.jks"
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          QE_SIGNING_STORE_FILE: ${{ runner.temp }}/qe-release.jks
          QE_SIGNING_STORE_PASSWORD: ${{ secrets.QE_SIGNING_STORE_PASSWORD }}
          QE_SIGNING_KEY_ALIAS: ${{ secrets.QE_SIGNING_KEY_ALIAS }}
          QE_SIGNING_KEY_PASSWORD: ${{ secrets.QE_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$QE_SIGNING_STORE_PASSWORD" && test -n "$QE_SIGNING_KEY_ALIAS" && test -n "$QE_SIGNING_KEY_PASSWORD" || { echo "::error::Missing signing secrets"; exit 1; }
          ./gradlew :app:assembleRelease --stacktrace
      - name: Upload signed updateable APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: QE-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload installable debug APK
        if: github.event_name == 'pull_request' && success()
        uses: actions/upload-artifact@v4
        with:
          name: QE-V10-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
